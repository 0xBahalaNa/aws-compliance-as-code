AWSTemplateFormatVersion: "2010-09-09"

# DEPLOY-PRINCIPAL REQUIREMENT: after this stack exists, any CloudFormation
# deploy or update that creates an IAM role, attaches a managed policy on
# ANY role, sets a role permissions boundary, mutates any of the
# three compliance roles, mutates a boundaryless role's inline policy or
# trust, or creates or updates a customer-managed policy MUST run as a
# principal NOT capped by AdminPermissionsBoundary or
# BucketPolicyAdminBoundary. AdminRole is break-glass, not a deploy role.
# Layer 1 (CloudTrailToCloudWatchRole, FlowLogsRole) and this stack
# (PasswordPolicyLambdaRole) set no PermissionsBoundary, so
# RequireBoundaryOnNewPrincipals Denies iam:CreateRole outright. Layer 3
# (EbsEncryptionLambdaRole) and Layer 4 (ConfigRecorderRole) attach AWS
# managed policies via ManagedPolicyArns; DenySiblingRoleEscalation Denies
# iam:AttachRolePolicy on "*", so even a CreateRole that wears this
# boundary cannot finish those stacks. The same unbounded principal is
# required for stack updates that touch either boundary policy, and for
# stack-delete: AdminPermissionsBoundary Denies iam:CreatePolicy and the
# four ManagedPolicy mutation verbs (iam:CreatePolicyVersion /
# iam:SetDefaultPolicyVersion / iam:DeletePolicy / iam:DeletePolicyVersion)
# account-wide (Resource: "*"). BucketPolicyAdminBoundary still Denies
# those four verbs on the two boundary ARNs only. Use the Org management
# account root or a CI/CD role without either boundary attached. Layer 1
# bucket-policy updates after lockdown still require the bounded
# BucketPolicyAdminRole (inverse rule). Description carries the
# assessor-facing summary (1024-char cap).

Description: >-
  Layer 2 IAM baseline: password policy (Lambda custom resource),
  AuditorRole (MFA, read-only), AdminRole (MFA + ExternalId, capped by
  AdminPermissionsBoundary), BucketPolicyAdminRole (Layer 1 bucket-policy
  carve-out; AdminRole denied PutBucketPolicy).
  AdminPermissionsBoundary DenyBoundarySelfMutation is account-wide;
  sibling still two-ARN scoped. RequireBoundaryOnNewPrincipals Denies
  CreateUser/CreateRole without this boundary. DenyMutationWithoutBoundary
  Denies PutRolePolicy, PutUserPolicy, AttachUserPolicy, and
  UpdateAssumeRolePolicy unless the target wears it.
  DenyAccessKeysAndLoginProfiles is account-wide (no condition keys).
  After this stack exists, unbounded principal for role create/mutate
  or CreatePolicy. Still open: groups; lambda:UpdateFunctionCode on
  existing functions (no iam: verb); CreateRole clones with no MFA.
  NIST 800-53 Rev 5 AC-2, AC-3, AC-6, AC-6(9), AC-6(10), IA-5, CM-5.
  Partial CJIS v6.1 IA-5; AAL2 MFA (IA-2) deferred to Identity Center.
Parameters:
  MinimumPasswordLength:
    Type: Number
    Default: 14
    MinValue: 14
    MaxValue: 128
    Description: >-
      Minimum password length. FedRAMP High baseline is 12; CJIS v6.1 aligns
      with NIST 800-63B (8+ recommended for AAL1, 14+ for AAL2 with memorized
      secrets). 14 is the conservative pick that covers both.

  MaxPasswordAgeInDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 1095
    Description: >-
      Maximum password age before forced rotation. 90 days is the historical
      FedRAMP/CJIS baseline; NIST 800-63B has moved away from forced rotation
      unless there is evidence of compromise, but Rev 5 still permits it and
      most audit baselines expect it.

  PasswordReusePrevention:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 24
    Description: >-
      Number of prior passwords blocked from reuse. 24 is the max IAM allows
      and matches the FedRAMP High baseline.

  AdminRoleExternalId:
    Type: String
    Default: "CHANGEME-set-a-long-random-string-on-deploy"
    NoEcho: true
    MinLength: 16
    Description: >-
      sts:ExternalId required when assuming AdminRole. Prevents the confused
      deputy problem: even a principal with sts:AssumeRole permission on this
      role cannot assume it without the agreed-upon ExternalId. Override on
      deploy with a long random string; the default is a placeholder so the
      template validates but should never ship to production.

  Layer1StackName:
    Type: String
    Default: compliance-layer1-logging
    Description: >-
      Name of the deployed Layer 1 (01-logging.yaml) stack. Layer 2 imports
      CloudTrailLogsBucketArn from that stack's Outputs to scope
      BucketPolicyAdminRole's bucket-config grants and BucketPolicyAdminBoundary's
      Allow set, replacing the string-constructed bucket ARN that silently
      drifted if Layer 1's bucket-name template changed. Override if Layer 1
      was deployed under a non-default stack name.

  AdminRoleSuffix:
    Type: String
    Default: admin
    Description: >-
      Suffix appended to AWS::StackName to construct AdminRole's RoleName and
      the matching Resource ARN inside DenyComplianceRoleTampering. Single
      Parameter drives both consumers so renaming the role updates both sites
      atomically; eliminates the silent-drift footgun where a rename made the
      boundary's Deny stop matching the actual role.

  AuditorRoleSuffix:
    Type: String
    Default: auditor
    Description: >-
      Suffix appended to AWS::StackName to construct AuditorRole's RoleName.
      AuditorRole has no PermissionsBoundary, so DenyComplianceRoleTampering's
      Resource entry for it uses !GetAtt AuditorRole.Arn instead of a
      string-constructed ARN; the suffix here drives only the role name.

  BucketPolicyAdminRoleSuffix:
    Type: String
    Default: bucket-policy-admin
    Description: >-
      Suffix appended to AWS::StackName to construct BucketPolicyAdminRole's
      RoleName and the matching Resource ARN inside DenyComplianceRoleTampering.
      Same rationale as AdminRoleSuffix.

Resources:

  # IAM password policy is an account-wide singleton with no CloudFormation
  # native resource type. AWS::IAM::AccountPasswordPolicy does not exist.
  # The standard pattern is a Lambda-backed custom resource that calls the
  # iam:UpdateAccountPasswordPolicy / iam:DeleteAccountPasswordPolicy APIs
  # in response to CFN Create/Update/Delete lifecycle events.
  PasswordPolicyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManagePasswordPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Resource MUST be "*" — the password policy is an account
              # singleton with no ARN, not a named resource. This is the
              # one case where "Resource: *" is correct under AC-6 because
              # the action's resource type IS the account, and the action
              # is scoped to two specific verbs.
              - Effect: Allow
                Action:
                  - iam:UpdateAccountPasswordPolicy
                  - iam:DeleteAccountPasswordPolicy
                  - iam:GetAccountPasswordPolicy
                Resource: "*"

  PasswordPolicyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-password-policy-cr"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PasswordPolicyLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              iam = boto3.client('iam')
              props = event.get('ResourceProperties', {})
              request_type = event['RequestType']

              try:
                  if request_type in ('Create', 'Update'):
                      iam.update_account_password_policy(
                          MinimumPasswordLength=int(props.get('MinimumPasswordLength', 14)),
                          RequireSymbols=props.get('RequireSymbols', 'true') == 'true',
                          RequireNumbers=props.get('RequireNumbers', 'true') == 'true',
                          RequireUppercaseCharacters=props.get('RequireUppercaseCharacters', 'true') == 'true',
                          RequireLowercaseCharacters=props.get('RequireLowercaseCharacters', 'true') == 'true',
                          AllowUsersToChangePassword=props.get('AllowUsersToChangePassword', 'true') == 'true',
                          MaxPasswordAge=int(props.get('MaxPasswordAge', 90)),
                          PasswordReusePrevention=int(props.get('PasswordReusePrevention', 24)),
                          HardExpiry=props.get('HardExpiry', 'false') == 'true',
                      )
                  elif request_type == 'Delete':
                      try:
                          iam.delete_account_password_policy()
                      except iam.exceptions.NoSuchEntityException:
                          # Already gone — Delete should be idempotent so the
                          # CFN stack can roll back cleanly even if a previous
                          # Delete partially succeeded.
                          pass
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # The custom resource that wires the parameters above into the Lambda. CFN
  # invokes the Lambda on Create / Update / Delete; the Lambda translates each
  # event into the matching iam API call. The Custom:: prefix is convention,
  # not enforced — the actual contract is the ServiceToken pointing at the
  # Lambda ARN.
  PasswordPolicy:
    Type: Custom::IAMPasswordPolicy
    Properties:
      ServiceToken: !GetAtt PasswordPolicyLambda.Arn
      MinimumPasswordLength: !Ref MinimumPasswordLength
      MaxPasswordAge: !Ref MaxPasswordAgeInDays
      PasswordReusePrevention: !Ref PasswordReusePrevention
      RequireSymbols: "true"
      RequireNumbers: "true"
      RequireUppercaseCharacters: "true"
      RequireLowercaseCharacters: "true"
      AllowUsersToChangePassword: "true"
      HardExpiry: "false"

  # PermissionsBoundary capping what the AdminRole can do regardless of which
  # identity-based policies are attached. Boundaries are not grants — they
  # define the maximum permissions a principal can ever effectively have.
  # SCP scopes to an account/OU; boundary scopes to a specific principal.
  AdminPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-admin-boundary"
      Description: >-
        Maximum permissions cap for AdminRole. Denies actions that would let
        the admin disable audit logging, exfiltrate KMS keys, or break the
        compliance baseline.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowMostAdminActions
            Effect: Allow
            Action: "*"
            Resource: "*"
          - Sid: DenyAuditAndLoggingTampering
            Effect: Deny
            Action:
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - cloudtrail:PutEventSelectors
              - cloudtrail:UpdateTrail
              - logs:DeleteLogGroup
              - logs:DeleteRetentionPolicy
              - s3:DeleteBucket
              - s3:PutBucketPolicy
            Resource: "*"
          - Sid: DenyKmsKeyDestruction
            Effect: Deny
            Action:
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:DeleteAlias
            Resource: "*"
          # User twins of the role-boundary verbs. Without them AdminRole
          # can set a user boundary, attach a managed policy, then strip
          # the boundary (AWS NoBoundaryUserDelete).
          - Sid: DenyIamBaselineTampering
            Effect: Deny
            Action:
              - iam:DeleteAccountPasswordPolicy
              - iam:UpdateAccountPasswordPolicy
              - iam:DeleteRolePermissionsBoundary
              - iam:PutUserPermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
            Resource: "*"
          # Compliance-critical roles cannot be deleted OR mutated. Blocks
          # both self-DoS (delete the role, bricking the Layer 1 lockdown
          # by leaving the AuditAdminRoleArn carve-out pointed at a non-
          # existent ARN) AND self-promotion (rewrite trust to drop MFA/
          # ExternalId, attach AdministratorAccess to pivot into the
          # lockdown carve-out). Mutation verbs matter most for the
          # BucketPolicyAdminRole - it has its own narrow boundary (see
          # BucketPolicyAdminBoundary below), but the mutation verbs here
          # are the first line of defense; the boundary is the second.
          - Sid: DenyComplianceRoleTampering
            Effect: Deny
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
            Resource:
              # AdminRole and BucketPolicyAdminRole wear PermissionsBoundary
              # references to this same stack's ManagedPolicies, so
              # !GetAtt RoleName.Arn would create a CFN dependency cycle
              # (boundary -> role; role -> boundary). String-construct via
              # the same suffix Parameter that drives the role's RoleName
              # so a rename updates both sites atomically.
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-${AdminRoleSuffix}"
              # AuditorRole has no PermissionsBoundary -> cycle-free, can
              # use a direct dependency edge.
              - !GetAtt AuditorRole.Arn
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-${BucketPolicyAdminRoleSuffix}"
          # Narrows sibling-role escalation (0XBN-148/#22): AdminRole cannot
          # mint a customer-managed policy, attach a managed policy to any
          # role, or set a permissions boundary on any role (Resource: "*";
          # the triplet is not carved out). Complements
          # DenyComplianceRoleTampering, which stays scoped to the three
          # named roles for delete/trust mutations only. #36 closes four
          # residual paths: (1) CreateUser/CreateRole without this boundary
          # (RequireBoundaryOnNewPrincipals), (2-3) PutRolePolicy /
          # PutUserPolicy / AttachUserPolicy on a principal that does not
          # wear it (DenyMutationWithoutBoundary), (4) ManagedPolicy version
          # rewrite account-wide (DenyBoundarySelfMutation Resource: "*").
          # CreateAccessKey / CreateLoginProfile / UpdateLoginProfile are
          # denied account-wide with no condition
          # (DenyAccessKeysAndLoginProfiles) because those APIs accept no
          # condition keys; a StringNotEquals on them would still Deny every
          # call. UpdateAssumeRolePolicy on a boundaryless role (path 5) is
          # on DenyMutationWithoutBoundary; left open it would void
          # DenyIamBaselineTampering via PasswordPolicyLambdaRole trust.
          # Still open, follow-up to #36: IAM groups (CreateGroup /
          # AttachGroupPolicy / AddUserToGroup; groups cannot wear a
          # permissions boundary); lambda:UpdateFunctionCode on the
          # deterministically named existing functions (no iam: verb, so
          # the condition-key mechanism cannot close it), including Layer 3
          # ebs-encryption-cr which can repoint EBS default encryption off
          # the agency CMK; CreateRole with this boundary can mint a clone
          # whose trust has no MFA and no ExternalId and whose
          # MaxSessionDuration is 12 hours, then PutRolePolicy Allow * on
          # it (effective permissions = AdminRole's set).
          - Sid: DenySiblingRoleEscalation
            Effect: Deny
            Action:
              - iam:CreatePolicy
              - iam:AttachRolePolicy
              - iam:PutRolePermissionsBoundary
            Resource: "*"
          # Condition value is the ARN this policy will have: no Path, name
          # ${AWS::StackName}-admin-boundary. Written as !Sub, not !Ref -
          # !Ref AdminPermissionsBoundary inside this PolicyDocument is a
          # self-ref cycle (cfn-lint E3004). The name string is typed again
          # here; it is not bound to ManagedPolicyName by a Parameter.
          - Sid: RequireBoundaryOnNewPrincipals
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:CreateRole
            Resource: "*"
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-admin-boundary"
          - Sid: DenyMutationWithoutBoundary
            Effect: Deny
            Action:
              - iam:PutRolePolicy
              - iam:PutUserPolicy
              - iam:AttachUserPolicy
              - iam:UpdateAssumeRolePolicy
            Resource: "*"
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-admin-boundary"
          # These three APIs advertise zero condition keys, so a negated
          # PermissionsBoundary operator cannot scope them. The Deny
          # is account-wide. AdminRole cannot issue replacement keys or
          # console profiles even for a boundaried user.
          - Sid: DenyAccessKeysAndLoginProfiles
            Effect: Deny
            Action:
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
            Resource: "*"
          # Self-referential closure for AdminRole (wears this boundary,
          # holds iam:* via AdministratorAccess). Denies the four
          # ManagedPolicy mutation verbs account-wide (Resource: "*") so
          # AdminRole cannot rewrite this boundary, the sibling
          # BucketPolicyAdminBoundary, or any other customer-managed
          # policy and then attach it. The managed-policy-attach and
          # boundary-set vectors of sibling-role escalation are closed by
          # DenySiblingRoleEscalation above; CreateUser / CreateRole and
          # the inline-policy verbs are closed by the statements above.
          # Remaining gaps are named on DenySiblingRoleEscalation.
          - Sid: DenyBoundarySelfMutation
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
            Resource: "*"

  # Read-only role for evidence collection, audit walkthroughs, and Config /
  # Security Hub data export. Trusted by the account principal, requires MFA.
  # Permissions = AWS-managed SecurityAudit + ReadOnlyAccess. Using the AWS
  # managed policies (instead of crafting a custom one) is intentional:
  # AWS updates them as new services launch, so the auditor role keeps pace
  # without template churn. Trade-off: you accept whatever AWS adds.
  AuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${AuditorRoleSuffix}"
      Description: >-
        Read-only role for compliance evidence collection. Requires MFA on
        assume.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustAccountPrincipalsWithMFA
            Effect: Allow
            Principal:
              # Account-root principal allows any IAM identity in this account
              # whose own policy grants sts:AssumeRole on this role. This is
              # the portfolio/single-account pattern. In a real AWS Org,
              # swap this for aws:PrincipalOrgID condition + Principal: "*"
              # to grant cross-account access to all org members.
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              Bool:
                # Refuses assume-role unless the caller authenticated with
                # MFA in this session. Closes the path where a leaked
                # long-lived access key alone could elevate to auditor.
                aws:MultiFactorAuthPresent: "true"
              NumericLessThan:
                # Refuses if the MFA was used > 1 hour ago. Forces fresh
                # auth even within a longer console session.
                aws:MultiFactorAuthAge: "3600"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      MaxSessionDuration: 3600

  # Privileged role for break-glass admin work. Trust policy uses two
  # conditions on top of MFA: sts:ExternalId (confused-deputy protection —
  # the caller must know an agreed-upon string, which a stolen sts:AssumeRole
  # permission alone does not provide) and a short MaxSessionDuration so
  # privileged sessions cannot be held open indefinitely.
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${AdminRoleSuffix}"
      Description: >-
        Privileged break-glass role. Requires MFA + ExternalId on assume.
        Permissions capped by AdminPermissionsBoundary.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustAccountPrincipalsWithMFAAndExternalId
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
              NumericLessThan:
                aws:MultiFactorAuthAge: "900"
              StringEquals:
                sts:ExternalId: !Ref AdminRoleExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      PermissionsBoundary: !Ref AdminPermissionsBoundary
      MaxSessionDuration: 3600

  # Permissions boundary for BucketPolicyAdminRole. The narrow inline
  # grant on the role is the *intent*; this boundary is the *enforcement*.
  # Even if a future iam:AttachRolePolicy attempt grants AdministratorAccess
  # to the role (currently blocked by DenySiblingRoleEscalation on
  # AdminPermissionsBoundary, but defense-in-depth assumes that deny could
  # be weakened or bypassed), the
  # role's effective permissions remain capped to the bucket-config action
  # set on the CloudTrail logs bucket. Distinct from AdminPermissionsBoundary
  # because that boundary denies s3:PutBucketPolicy - the whole reason
  # BucketPolicyAdminRole exists is to perform that action.
  BucketPolicyAdminBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-bucket-policy-admin-boundary"
      Description: >-
        Permissions boundary capping BucketPolicyAdminRole to the bucket-
        config action set on the CloudTrail logs bucket. Defense in depth
        against future iam:AttachRolePolicy escalation.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CapToCloudTrailBucketConfig
            Effect: Allow
            Action:
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketAcl
              - s3:PutBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:PutBucketObjectLockConfiguration
              - s3:PutLifecycleConfiguration
              - s3:PutBucketVersioning
              - s3:PutBucketCORS
              - s3:PutBucketNotification
              - s3:PutBucketLogging
              - s3:PutReplicationConfiguration
              - s3:PutBucketTagging
              - s3:PutBucketOwnershipControls
            Resource:
              Fn::ImportValue: !Sub "${Layer1StackName}-CloudTrailLogsBucketArn"
          # Same Sid and four verbs as AdminPermissionsBoundary DenyBoundarySelfMutation,
          # but Resource stays the two boundary ARNs. Admin copy was widened
          # to "*" in #36; this copy is unchanged (BucketPolicyAdminRole has
          # no iam:* today). Anticipatory: unreachable until a future change
          # widens identity policy or this Allow set.
          - Sid: DenyBoundarySelfMutation
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-admin-boundary"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-bucket-policy-admin-boundary"
          # Mirror of DenyIamBaselineTampering's iam:DeleteRolePermissionsBoundary
          # Deny in AdminPermissionsBoundary (0XBN-148/#22). Anticipatory:
          # BucketPolicyAdminRole has no iam:* today, but if a future change
          # widens its identity policy, this blocks detaching the boundary
          # to escape the S3-only cap.
          - Sid: DenyBoundaryDetachment
            Effect: Deny
            Action:
              - iam:DeleteRolePermissionsBoundary
            Resource: "*"

  # Narrow break-glass role permitted to modify the CloudTrail bucket
  # policy. The general AdminRole's AdminPermissionsBoundary explicitly
  # denies s3:PutBucketPolicy (preventing the admin from tampering with
  # audit logging), so a SEPARATE role is needed to satisfy Layer 1's
  # bucket-policy lockdown carve-out. Trust mirrors AdminRole (MFA +
  # ExternalId). The role carries a dedicated boundary
  # (BucketPolicyAdminBoundary above) re-capping its effective permissions
  # to the same action set as the inline grant - so iam:AttachRolePolicy
  # escalation cannot expand the role beyond bucket-config on the
  # CloudTrail bucket, even if the DenyComplianceRoleTampering Deny on
  # AdminPermissionsBoundary is ever weakened.
  BucketPolicyAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-${BucketPolicyAdminRoleSuffix}"
      Description: >-
        Narrow break-glass role permitted to modify the CloudTrail bucket
        policy and related bucket-config actions. Pass its ARN to Layer
        1's AuditAdminRoleArn parameter.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustAccountPrincipalsWithMFAAndExternalId
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
              NumericLessThan:
                aws:MultiFactorAuthAge: "900"
              StringEquals:
                sts:ExternalId: !Ref AdminRoleExternalId
      Policies:
        - PolicyName: BucketPolicyAdmin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Scoped to the single CloudTrail logs bucket. Matches the
              # action set Layer 1's lockdown protects, plus
              # GetBucketPolicy for read access during edits.
              - Sid: ManageCloudTrailBucketConfig
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketAcl
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketCORS
                  - s3:PutBucketNotification
                  - s3:PutBucketLogging
                  - s3:PutReplicationConfiguration
                  - s3:PutBucketTagging
                  - s3:PutBucketOwnershipControls
                Resource:
                  Fn::ImportValue: !Sub "${Layer1StackName}-CloudTrailLogsBucketArn"
      PermissionsBoundary: !Ref BucketPolicyAdminBoundary
      MaxSessionDuration: 3600

Outputs:
  AuditorRoleArn:
    Description: ARN of the read-only auditor role. Pass to Security Hub / Config / evidence collectors.
    Value: !GetAtt AuditorRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuditorRoleArn"

  AdminRoleArn:
    Description: ARN of the boundary-capped admin role. Break-glass only.
    Value: !GetAtt AdminRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AdminRoleArn"

  AdminPermissionsBoundaryArn:
    Description: ARN of the permissions boundary applied to the admin role. Attach to other privileged roles to cap their effective permissions.
    Value: !Ref AdminPermissionsBoundary
    Export:
      Name: !Sub "${AWS::StackName}-AdminPermissionsBoundaryArn"

  BucketPolicyAdminRoleArn:
    Description: >-
      ARN of the narrow break-glass role permitted to modify the CloudTrail
      bucket policy. Pass to Layer 1's AuditAdminRoleArn parameter to wire
      up the bucket-policy lockdown - NOT AdminRoleArn (the AdminPermissions-
      Boundary denies that role from PutBucketPolicy, which would brick the
      lockdown).
    Value: !GetAtt BucketPolicyAdminRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketPolicyAdminRoleArn"
