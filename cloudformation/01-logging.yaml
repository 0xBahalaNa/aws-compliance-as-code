AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Layer 1 - Logging & Monitoring. Deploys a multi-region CloudTrail with a
  tamper-proof S3 log bucket (Object Lock in COMPLIANCE mode), a CloudWatch
  Log Group for near-real-time delivery, and a VPC Flow Log on the default
  VPC. Satisfies NIST 800-53 Rev 5 AU-2, AU-3, AU-9, AU-12. Partial CJIS v6.1
  5.4.1 - integrity controls in place; S3 long-term store encryption-at-rest
  closes by passing the Layer 3 CMK ARN to the LogsBucketCmkArn parameter
  (agency-managed key). CloudWatch Logs hot-mirror remains under AWS-managed
  encryption; full CJI-at-rest (SC-28(1)) closure deferred to v1.2.0.
  Bucket-policy lockdown (s3:PutBucketPolicy / s3:DeleteBucketPolicy denied
  to everyone except the Layer 2 audit admin role) wires in via the optional
  AuditAdminRoleArn parameter - same two-pass pattern as the CMK. Every
  taggable resource carries a compliance/layer/project tag triple (CM-8).

Parameters:
  TrailName:
    Type: String
    Default: org-cloudtrail
    Description: Name of the multi-region CloudTrail trail.

  CloudTrailRetentionInDays:
    Type: Number
    Default: 365
    AllowedValues: [30, 60, 90, 180, 365, 400, 545, 731, 1827, 3653]
    Description: >-
      CloudWatch Logs retention for the CloudTrail group. S3 Object Lock
      handles long-term immutable retention; CloudWatch is the hot,
      queryable copy. 365 (one year) is the conservative default - long
      enough to investigate slow-burn account compromise without
      indefinitely growing the queryable cache.

  FlowLogsRetentionInDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 180, 365, 400, 545, 731, 1827, 3653]
    Description: >-
      CloudWatch Logs retention for the VPC Flow Logs group. Flow Logs
      generate 10-100x the volume of CloudTrail, so 90 days is the
      operational sweet spot: covers most incident-response windows
      without the Flow Logs storage cost dominating the CloudWatch bill.
      Bump if a longer mandate applies.

  S3ObjectLockRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: >-
      Default Object Lock retention applied to every log object in
      COMPLIANCE mode. FedRAMP High AU-11 baseline is 1 year online; raise
      for longer mandates.

  DefaultVpcId:
    Type: AWS::EC2::VPC::Id
    Description: >-
      VPC to attach Flow Logs to. Select the default VPC for AC compliance;
      CloudFormation has no intrinsic for "default VPC", so it is
      parameterized.

  LogsBucketCmkArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the Layer 3 compliance CMK (03-encryption.yaml output
      ComplianceCmkArn). Leave empty on the first deploy - Layer 3 does
      not exist yet, so the logs bucket falls back to SSE-S3 (AES256).
      After Layer 3 is deployed, update this stack with the CMK ARN to
      switch the bucket to SSE-KMS with the agency-managed key (SC-28 /
      CJIS SC-28(1)). Two-pass by design: Layer 1 is numbered first but
      its encryption key is created in Layer 3.

  AuditAdminRoleArn:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Optional comma-separated list of IAM role ARNs permitted to modify
      the CloudTrail bucket policy AND other sensitive bucket-config
      actions. Supply the Layer 2 BucketPolicyAdminRole (Layer 2 output
      BucketPolicyAdminRoleArn) as the primary entry; optionally append
      a break-glass role for primary-loss redundancy. CommaDelimitedList
      loses the per-item AllowedPattern regex the previous String form
      enforced - operators must pass valid IAM role ARNs without trailing
      whitespace; CFN parameter resolution will not catch malformed
      entries until deploy. Do NOT supply the general AdminRole here -
      AdminPermissionsBoundary explicitly denies s3:PutBucketPolicy on
      AdminRole, so its inclusion here would brick the lockdown (the
      bucket policy carves out the role, but IAM still denies the role
      from acting). When supplied, the lockdown denies every other
      principal (root included - root cannot bypass an explicit S3
      resource-policy Deny, so carving root out would add bypass surface
      and no recovery value; if ALL carved-out roles are deleted,
      recovery requires AWS Support) from a comprehensive set of
      bucket-config tamper actions. The carve-out uses ArnNotEquals on
      aws:PrincipalArn against the list (case- and form-tolerant where
      the previous StringNotEquals was case-sensitive), NOT NotPrincipal -
      the latter with an account-root ARN exempts every in-account IAM
      principal from the Deny per AWS docs, neutralizing the lockdown.
      Leave empty on the first deploy; set on a follow-up update after
      Layer 2 is deployed. Same two-pass pattern as LogsBucketCmkArn.

      OPERATIONAL NOTE: this parameter must be passed on EVERY subsequent
      deploy that touches Layer 1. CloudFormation does not carry parameter
      values forward by default; an omitted deploy defaults this to an
      empty list and silently DISABLES the lockdown via the
      LockBucketPolicy condition - the Deny statement vanishes with no
      signal. Use
      --parameter-overrides ParameterKey=AuditAdminRoleArn,UsePreviousValue=true
      in CI/CD, or always pass the value explicitly.

      DEPLOY-PRINCIPAL REQUIREMENT: any Layer 1 stack update that itself
      modifies the bucket policy must be executed AS one of the carved-out
      roles (BucketPolicyAdminRole or any break-glass role passed alongside
      it) - other deploy principals hit the lockdown Deny and the update
      rolls back. Assume the role via sts before running cloudformation
      deploy on Layer 1.

Conditions:
  # True once a Layer 3 CMK ARN has been supplied. Selects SSE-KMS over
  # the SSE-S3 fallback for the logs bucket.
  UseCmkForLogsBucket: !Not [!Equals [!Ref LogsBucketCmkArn, ""]]

  # True once at least one Layer 2 admin role ARN has been supplied via
  # the CommaDelimitedList parameter. The parameter's Default: "" resolves
  # to a single-element list [""] - !Select [0, ...] grabs that first
  # element so the comparison is against a scalar string, not a list.
  # When the first element is non-empty, the bucket policy gains a Deny
  # preventing any principal outside the carve-out list from rewriting
  # or removing the policy.
  LockBucketPolicy: !Not [!Equals [!Select [0, !Ref AuditAdminRoleArn], ""]]

Resources:

  # S3 bucket holding immutable CloudTrail log files. Object Lock must be
  # enabled at create time (AWS::S3::Bucket.ObjectLockEnabled is immutable),
  # so the bucket is the foundation of the AU-9 evidence-integrity story.
  CloudTrailLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "cloudtrail-logs-${AWS::AccountId}"
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            # COMPLIANCE mode: even the root account cannot shorten or
            # delete within the retention window. This is what AU-9
            # "Protection of Audit Information" leans on for evidence
            # integrity.
            Mode: COMPLIANCE
            Days: !Ref S3ObjectLockRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          # SSE-KMS with the Layer 3 agency-managed CMK once its ARN is
          # wired in via LogsBucketCmkArn; SSE-S3 (AES256) as the
          # pre-Layer-3 fallback. CJIS v6.1 SC-28(1) requires an
          # agency-managed key for CJI at rest - the CMK branch closes
          # that gap; AES256 alone uses an AWS-managed key.
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UseCmkForLogsBucket, "aws:kms", "AES256"]
              KMSMasterKeyID: !If
                - UseCmkForLogsBucket
                - !Ref LogsBucketCmkArn
                - !Ref "AWS::NoValue"
            # S3 Bucket Keys: with SSE-KMS, S3 generates one bucket-level
            # key and derives per-object keys from it instead of calling
            # KMS GenerateDataKey on every PUT - a large KMS cost cut for
            # a high-volume log bucket. No effect under SSE-S3.
            BucketKeyEnabled: !If [UseCmkForLogsBucket, true, !Ref "AWS::NoValue"]
      VersioningConfiguration:
        # Required for Object Lock; also lets a poisoned overwrite be
        # ignored because previous versions remain immutable.
        Status: Enabled
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

  # Bucket policy: grants CloudTrail the writes it needs, explicitly denies
  # deletion of log objects, denies insecure transport, AND (when
  # LockBucketPolicy is true) denies any principal other than the audit
  # admin role from modifying or removing the bucket policy itself.
  # Object Lock is the hard floor; this policy is the auditable AU-9 layer
  # on top of it; the lockdown is the AU-9 / AC-6 layer on top of THAT.
  CloudTrailLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailGetBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailLogsBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowCloudTrailPutObject
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${CloudTrailLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyLogObjectDeletion
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub "${CloudTrailLogsBucket.Arn}/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt CloudTrailLogsBucket.Arn
              - !Sub "${CloudTrailLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Conditional bucket-CONFIG lockdown. Applies to every principal
          # (Principal: "*") and exempts only the carve-out role via a
          # Condition on aws:PrincipalArn. NotPrincipal was rejected here:
          # AWS treats arn:aws:iam::ACCOUNT:root in NotPrincipal as "the
          # entire account," which exempts every in-account IAM principal
          # from the Deny and makes the lockdown a no-op for the threat
          # model it targets (in-account compromised credentials, lateral
          # movement via assumed roles). aws:PrincipalArn resolves to the
          # role ARN (not the session ARN) for assumed-role sessions, so
          # the carve-out works for both direct calls and STS sessions.
          # Root is intentionally NOT carved out - root cannot be blocked
          # by a bucket policy anyway, so an exemption provides zero
          # defensive value and (per the NotPrincipal failure mode above)
          # 100% of the bypass surface. Action list covers the full
          # bucket-config tamper surface: policy, ACL, encryption,
          # public-access block, Object-Lock config, lifecycle, versioning,
          # CORS, notifications, logging, replication, tagging, ownership
          # controls, and bucket deletion. !If with AWS::NoValue removes
          # the statement entirely when LockBucketPolicy is false (first-
          # deploy state); second-pass deploy locks it down.
          - !If
            - LockBucketPolicy
            - Sid: DenyBucketConfigTamperingExceptAuditAdmin
              Effect: Deny
              Principal: "*"
              Action:
                - s3:PutBucketPolicy
                - s3:DeleteBucketPolicy
                - s3:PutBucketAcl
                - s3:PutBucketPublicAccessBlock
                - s3:PutEncryptionConfiguration
                - s3:PutBucketObjectLockConfiguration
                - s3:PutLifecycleConfiguration
                - s3:PutBucketVersioning
                - s3:PutBucketCORS
                - s3:PutBucketNotification
                - s3:PutBucketLogging
                - s3:PutReplicationConfiguration
                - s3:PutBucketTagging
                - s3:PutBucketOwnershipControls
                # ASYMMETRY: s3:DeleteBucket is in this lockdown Deny but
                # NOT in BucketPolicyAdminRole's inline grant or
                # BucketPolicyAdminBoundary's Allow set (see Layer 2
                # ManageCloudTrailBucketConfig + CapToCloudTrailBucketConfig).
                # The carve-out advertises an exemption the role cannot
                # exercise - intentional, to make bucket deletion fully
                # unreachable from within the carved-out principal set
                # and preserve audit evidence. To delete the bucket
                # legitimately, an operator must first widen
                # BucketPolicyAdminRole's grants in Layer 2.
                - s3:DeleteBucket
              Resource: !GetAtt CloudTrailLogsBucket.Arn
              Condition:
                # ArnNotEquals (not StringNotEquals): ARN-shape-aware
                # comparison tolerates ARN form variants StringNotEquals
                # would silently reject (case differences, path-segment
                # whitespace from a templating layer). Against the
                # CommaDelimitedList, the principal's ARN must match ANY
                # entry to exit the Deny - so the lockdown carves out the
                # full primary + break-glass set with one Statement.
                ArnNotEquals:
                  aws:PrincipalArn: !Ref AuditAdminRoleArn
            - !Ref AWS::NoValue

  # CloudWatch Log Group is the hot, queryable mirror of CloudTrail events.
  # S3 stores immutable evidence; CloudWatch is for alerting and ad-hoc
  # investigation (AU-6 review/analysis lives here, even though this layer
  # is technically AU-2/3/9/12).
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/cloudtrail/${TrailName}"
      RetentionInDays: !Ref CloudTrailRetentionInDays
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

  # IAM role CloudTrail assumes to write events into CloudWatch Logs.
  # Scoped strictly to the log group ARN — least privilege per AC-6.
  CloudTrailToCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailWriteCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CloudTrailLogGroup.Arn}:*"
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

  # The trail itself. IsMultiRegionTrail + IncludeGlobalServiceEvents is
  # the AU-2/AU-12 completeness story: every region's API plus global
  # services (IAM, STS, CloudFront, Route 53) are captured by a single
  # trail. Log file validation produces SHA-256 digest files in S3, which
  # is the AU-9 cryptographic-integrity check on top of Object Lock
  # immutability.
  MainTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailLogsBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref CloudTrailLogsBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailToCloudWatchRole.Arn
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

  # VPC Flow Logs cover the data plane (packets moving through ENIs) which
  # CloudTrail does NOT see. CloudTrail = "who called the API"; Flow Logs
  # = "what traffic crossed the wire". Both are needed for AU-2 completeness.
  FlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/flowlogs/${DefaultVpcId}"
      RetentionInDays: !Ref FlowLogsRetentionInDays
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogsWriteCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "${FlowLogsGroup.Arn}:*"
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

  DefaultVpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref DefaultVpcId
      # TrafficType ALL captures accepted + rejected so denied connection
      # attempts (potential reconnaissance) are evidence too.
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: Compliance
          Value: NIST-800-53-Rev5
        - Key: Layer
          Value: 1-Logging
        - Key: Project
          Value: aws-compliance-as-code

Outputs:
  CloudTrailLogsBucketName:
    Description: S3 bucket holding immutable CloudTrail logs.
    Value: !Ref CloudTrailLogsBucket
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailLogsBucketName"

  CloudTrailLogsBucketArn:
    Description: ARN of the CloudTrail logs bucket. Imported by Layer 2 to scope BucketPolicyAdminRole's bucket-config grants and to anchor BucketPolicyAdminBoundary's Allow set, replacing string-constructed bucket ARNs that silently drifted if the bucket-name template changed.
    Value: !GetAtt CloudTrailLogsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailLogsBucketArn"

  CloudTrailArn:
    Description: ARN of the multi-region trail.
    Value: !GetAtt MainTrail.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailArn"

  CloudTrailLogGroupArn:
    Description: CloudWatch Log Group ARN for downstream metric filters and alarms.
    Value: !GetAtt CloudTrailLogGroup.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailLogGroupArn"

  FlowLogsGroupArn:
    Description: CloudWatch Log Group ARN for VPC Flow Logs.
    Value: !GetAtt FlowLogsGroup.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FlowLogsGroupArn"
